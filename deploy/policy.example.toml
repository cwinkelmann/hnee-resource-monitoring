# Who may use which GPUs. Keys are OS usernames exactly as /proc reports them.
# Agreed 2026-08-19: dorian 0-3, cwinkelmann 4-7.
[assignments]
"dorian.zwanzig" = [0, 1, 2, 3]
"cwinkelmann"    = [4, 5, 6, 7]

[rules]
# A process holding at least idle_min_mib while the GPU sits below idle_util_pct
# for idle_grace_s is "parked" -- the forgotten-notebook case.
idle_util_pct   = 5
idle_min_mib    = 1024
idle_grace_s    = 1800      # 30 min: long enough not to flag a job between epochs

# Capacity alarm: fires when NO GPU has this much free. 40 GiB is the floor for
# starting a real training run on an 80 GB card.
capacity_free_mib = 40960

[notify]
cooldown_s = 3600           # one message per incident per hour, not per poll
channel    = "#gpu-watch"

[booking]
# An important booking that would squeeze a lendable booking already under way starts
# no earlier than this many minutes from when it is made.
grace_minutes = 30

# A user may hold at most this many bookings that have not started yet. It counts rows, so
# a 4-GPU group costs 4. Without it, a 13,000-job pipeline books the whole calendar and a
# colleague who needs 80 GiB is offered a slot a fortnight out.
max_pending_per_user = 16

# Parked GET /api/claims/<id>/events connections. Only *running* jobs watch, so this is
# about twice carrot's 32 concurrent slots. Past it the route answers 503 and clients poll.
max_watchers = 64
